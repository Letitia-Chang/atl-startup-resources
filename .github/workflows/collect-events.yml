name: Collect public event candidates

on:
  # The feature-branch trigger validates the connector before this becomes a
  # manually operated workflow. No schedule or automatic publication exists.
  push:
    branches:
      - feature/event-calendar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-event-collection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - name: Install collector and public-page browser
        run: |
          python -m pip install './collector[browser]'
          python -m playwright install --with-deps chromium
      - name: Run local fixture tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=collector/src python -m unittest discover -s collector/tests -v
      - name: Collect public event candidates
        run: |
          set -o pipefail
          mkdir -p build/live
          PYTHONPATH=collector/src python -m atl_startup_events.cli --db build/live/events.db refresh --days 120 --export build/live/approved.json | tee build/live/collection-results.jsonl
      - name: Export review queue and source health without approving events
        if: always()
        run: |
          PYTHONPATH=collector/src python -m atl_startup_events.cli --db build/live/events.db export --state pending --output build/live/pending.json
          PYTHONPATH=collector/src python -m atl_startup_events.cli --db build/live/events.db sources > build/live/source-health.json
      - name: Retain candidate data for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-collection-${{ github.run_id }}
          path: build/live/
          retention-days: 7
